[package]
name = "insdesk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "InsDesk session engines: host and controller orchestration over the E2E channel"

[dependencies]
insdesk-proto.workspace = true
insdesk-crypto.workspace = true
insdesk-net.workspace = true
insdesk-media.workspace = true
insdesk-fs.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
