## Forwarded to insdesk-media / insdesk-fs for real desktop backends.
capture-scrap = ["insdesk-media/capture-scrap"]
input-enigo = ["insdesk-media/input-enigo"]
uac-windows = ["insdesk-media/uac-windows"]
clipboard-arboard = ["insdesk-fs/clipboard-arboard"]
