[package]
name = "insdesk-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "InsDesk media layer: tile-delta video codec, screen capture, input injection and UAC bridge"

[dependencies]
insdesk-proto.workspace = true
flate2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Real cross-platform backends — opt-in so the core builds on any host.
scrap = { workspace = true, optional = true }
enigo = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
] }

[features]
default = []
## Real screen capture via the `scrap` crate (needs X11/DXGI/CoreGraphics).
capture-scrap = ["dep:scrap"]
## Real input injection via the `enigo` crate (needs XTest/SendInput/CGEvent).
input-enigo = ["dep:enigo"]
## Windows UAC secure-desktop bridge (service + desktop switching).
uac-windows = ["dep:windows"]
